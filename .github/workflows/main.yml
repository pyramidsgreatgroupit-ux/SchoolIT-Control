name: Build SchoolIT Agent

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download ZIP from repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: powershell
        run: |
          Expand-Archive -Path "SchoolIT_Agent_GitHub_Actions.zip" -DestinationPath "extracted" -Force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EXE
        shell: powershell
        run: |
          $project = Get-ChildItem -Path extracted -Filter "SchoolIT.Agent.csproj" -Recurse | Select-Object -First 1
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SchoolIT-Agent-Windows-x64
          path: publish/SchoolIT.Agent.exe
